version: 1

source:
  file: result.xlsx
  sheet: 大纲批跑结果
  header_row: 1

selection:
  all: true

fields:
  inputs:
    - field: title
      label: 标题
    - field: summary
      label: 摘要
    - field: retrieved_knowledge
      label: 检索知识
  outputs:
    - field: generated_outline
      label: 生成大纲

generation_prompt:
  file: generation_prompt.md

evaluation_prompt:
  file: evaluation_prompt.md

criteria:
  - name: 体系完整性
    instruction: 检查大纲是否覆盖理解标题所指主题必需的核心知识。
  - name: 标题粒度
    instruction: 检查三级标题是否过细或过大，是否适合作为后续独立讲解的知识入口。
  - name: 核心知识重复
    instruction: 检查不同章节是否实质讲解了相同核心知识。
  - name: 主题范围
    instruction: 检查内容是否超出标题限定的知识范围。

report:
  enabled: true

output:
  directory: runs
